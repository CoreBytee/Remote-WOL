<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Wake On Lan Relay</title>

        <style>
            * {
                color: hsl(0, 0%, 90%);
                font-family:
                    Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
                text-align: center;

                margin: 0;
            }

            html,
            body {
                background-color: black;
                height: 100%;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            label {
                color:;
            }

            input,
            button {
                background-color: hsl(0, 0%, 15%);
                transition: background-color 0.2s ease-in-out;
                border: none;
                padding: 5px;
                border-radius: 5px;
            }

            input:hover,
            button:hover {
                background-color: hsl(0, 0%, 20%);
            }

            button {
                cursor: pointer;
                font-weight: 900;
            }

            .footer {
                margin-top: auto;
            }

            .footer,
            .footer > * {
                font-size: 0.9rem;
                color: hsl(0, 0%, 50%);
            }

            .container {
                background-color: hsl(0, 0%, 10%);
                border-radius: 10px;

                padding: 20px;
                padding-left: 30px;
                padding-right: 30px;

                width: 300px;
                height: 250px;

                display: flex;
                flex-direction: column;

                .login-prompt,
                .send-page {
                    display: none;
                }
            }

            .container.login .login-prompt {
                display: flex;
                flex-direction: column;
                gap: 10px;
                flex: 1;

                .password-container {
                    display: flex;
                    justify-content: center;
                    flex-direction: column;
                    gap: 5px;
                    flex: 1;

                    .error {
                        color: darkred;
                    }
                }
            }

            .container.main .send-page {
                display: flex;
                flex-direction: column;
                gap: 10px;
                flex: 1;

                .button-container {
                    display: flex;
                    justify-content: center;
                    flex-direction: column;
                    gap: 5px;
                    flex: 1;

                    .send-button {
                        font-size: 1.5rem;
                        font-weight: 800;
                        border-radius: 10px;
                        padding: 15px;
                    }

                    .status-text {
                        opacity: 0;
                        transform: translateY(2px);
                        color: white;

                        transition:
                            opacity 0.1s ease-in-out,
                            transform 0.1s ease-in-out,
                            color 0.1s ease-in-out;
                    }

                    .status-text.success,
                    .status-text.error,
                    .status-text.loading {
                        opacity: 1;
                        transform: translateY(0px);
                    }

                    .status-text.success {
                        color: green;
                    }

                    .status-text.error {
                        color: darkred;
                    }
                }
            }
        </style>

        <script>
            async function checkPassword(password) {
                if (password === undefined) return false;
                if (password === "") return false;
                const data = { password };
                const body = JSON.stringify(data);
                const headers = { "content-type": "application/json" };
                const options = { body, headers, method: "POST" };
                const response = await fetch("/api/check_password", options);
                return response.ok;
            }

            async function sendPacket() {
                const password = sessionStorage.getItem("wolr-password");
                const data = { password };
                const body = JSON.stringify(data);
                const headers = { "content-type": "application/json" };
                const options = { body, headers, method: "POST" };
                const response = await fetch("/api/send_packet", options);
                return response.ok;
            }

            function setLoginState(loggedIn) {
                const container = document.getElementById("container");
                container.className = loggedIn
                    ? "container main"
                    : "container login";
            }

            // Login state
            document.addEventListener("DOMContentLoaded", async () => {
                const password = sessionStorage.getItem("wolr-password");
                const correct = await checkPassword(password);
                return setLoginState(correct);
            });

            // Footer year
            document.addEventListener("DOMContentLoaded", () => {
                const footer = document.getElementById("footer-year");
                footer.innerText = new Date().getFullYear();
            });

            // Login
            document.addEventListener("DOMContentLoaded", () => {
                const passwordInput = document.getElementById("password-input");
                const loginButton = document.getElementById("login-button");
                const error = document.getElementById("error");

                loginButton.addEventListener("click", async () => {
                    const password = passwordInput.value;
                    const ok = await checkPassword(password);

                    if (ok) {
                        sessionStorage.setItem("wolr-password", password);
                        setLoginState(true);
                    } else {
                        error.innerText = "Password check failed";
                    }
                });
            });

            // Send packet
            document.addEventListener("DOMContentLoaded", () => {
                const sendPacketButton = document.getElementById("send-button");
                const statusText = document.getElementById("status-text");
                let statusTimeout = null;

                sendPacketButton.addEventListener("click", async () => {
                    statusText.innerText = "Loading";
                    statusText.className = "status-text loading";

                    if (statusTimeout) clearTimeout(statusTimeout);

                    const success = await sendPacket();
                    if (success) {
                        statusText.innerText = "Packet sent successfully!";
                        statusText.className = "status-text success";
                    } else {
                        statusText.innerText =
                            "Something went wrong while sending the packet!";
                        statusText.className = "status-text error";
                    }

                    statusTimeout = setTimeout(() => {
                        statusText.className = "status-text";
                        statusTimeout = null;
                    }, 3000);
                });
            });
        </script>
    </head>
    <body>
        <div class="container" id="container">
            <div class="login-prompt">
                <h3>Log in to use WOLR</h3>
                <div class="password-container">
                    <input
                        type="password"
                        id="password-input"
                        placeholder="Enter password"
                    />
                    <button type="button" id="login-button">Login</button>
                    <p class="error" id="error"></p>
                </div>
            </div>
            <div class="send-page">
                <h3>Press the button below to send the WOL packet</h3>
                <div class="button-container">
                    <button type="button" id="send-button" class="send-button">
                        Send packet
                    </button>
                    <p class="status-text" id="status-text">Status</p>
                </div>
            </div>
            <p class="footer" id="footer">
                <a href="https://github.com/CoreBytee/Remote-WOL"
                    >WOLR is a project</a
                >
                by <a href="https://github.com/CoreBytee">CoreByte</a> ©
                <span id="footer-year"></span> MIT
            </p>
        </div>
    </body>
</html>
