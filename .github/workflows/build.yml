name: Build binaries
on: [push]

jobs:
    build:
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-24.04, ubuntu-24.04-arm]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
            - uses: Swatinem/rust-cache@v2
            - name: Build
              run: cargo build --verbose --release
            - uses: actions/upload-artifact@v7
              with:
                  name: wol-relay-${{ matrix.os == 'ubuntu-24.04' && 'amd64' || 'arm64' }}
                  path: ./target/release/wol-relay
