name: Build binaries
on: [push]

jobs:
    build:
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-24.04, ubuntu-24.04-arm]
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
            packages: write
        outputs:
            amd64-binary: ${{ steps.artifact.outputs.amd64-binary }}
            arm64-binary: ${{ steps.artifact.outputs.arm64-binary }}
        steps:
            - uses: actions/checkout@v6
            - uses: Swatinem/rust-cache@v2
            - name: Build
              run: cargo build --verbose --release
            - name: Upload Artifact
              id: artifact
              uses: actions/upload-artifact@v7
              with:
                  name: wol-relay-${{ matrix.os == 'ubuntu-24.04' && 'amd64' || 'arm64' }}
                  path: ./target/release/wol-relay

    docker-build:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v6
            - name: Download amd64 binary
              uses: actions/download-artifact@v7
              with:
                  name: wol-relay-amd64
                  path: ./binaries/amd64
            - name: Download arm64 binary
              uses: actions/download-artifact@v7
              with:
                  name: wol-relay-arm64
                  path: ./binaries/arm64
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: ${{ github.ref == 'refs/heads/main' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: linux/amd64,linux/arm64
                  file: ./Dockerfile
